<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Your Penny sign-in code</title>
  </head>
  <body style="margin:0;background:#f8f1e8;color:#3b302e;font-family:Arial,Helvetica,sans-serif">
    <div style="max-width:480px;margin:32px auto;padding:28px;background:#fffaf4;border:1px solid #eadbd0;border-radius:20px">
      <div style="font-size:25px;font-weight:700;color:#6e4140">Penny</div>
      <h1 style="font-size:22px;line-height:1.3;margin:24px 0 12px">Your sign-in code</h1>
      <p style="font-size:15px;line-height:1.6">Enter this code in Penny to sign in:</p>
      <p style="font-size:30px;letter-spacing:8px;font-weight:700;text-align:center;padding:18px;background:#f5e9de;border-radius:14px">{{ .Token }}</p>
      <p style="font-size:13px;line-height:1.6;color:#655957">If you did not request this, you can ignore this email. Never share the code with anyone.</p>
      <p style="font-size:12px;color:#766967;margin-top:28px">Penny · Support: rzstudios.dev@gmail.com</p>
    </div>
  </body>
</html>
